# Publish @kingdom-community/session-client to npm.
#
# workflow_dispatch ONLY. Releases are a deliberate act: nothing here fires on a
# push, a tag or a merge, so an accidental commit can never publish a version.
# The version published is whatever is in js/package.json on the chosen ref;
# bump it in a pull request first.
name: Release (npm)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and check without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  # For npm trusted publishing (OIDC). Harmless when publishing with a token.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: js/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The tests gate the release as well as the pull request. A release is the
      # one build nobody gets to retry quietly.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Pack (dry run)
        if: ${{ inputs.dry_run }}
        run: npm pack --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

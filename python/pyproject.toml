[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "session-client"
version = "0.1.0"
description = "Client for a bearer-token identity service - register, login, validate, refresh, logout - with success, refusal and unavailable as three distinct outcomes."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Daniel McCoy Stephenson", email = "dmccoystephenson@gmail.com"}]
keywords = [
    "authentication",
    "auth",
    "session",
    "bearer-token",
    "identity",
    "login",
    "api-client",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# No runtime dependencies, on purpose: the standard library's urllib is enough
# for five JSON endpoints, and a client sitting in an authentication path is a
# poor place to add a supply chain.
dependencies = []

[project.urls]
Homepage = "https://github.com/kingdom-community/session-client"
Repository = "https://github.com/kingdom-community/session-client"
Issues = "https://github.com/kingdom-community/session-client/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
session_client = ["py.typed"]
